# MySQL 8 Production Profile Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate DDL Auto Management (Managed via Flyway)
spring.jpa.hibernate.ddl-auto=none

# JWT Configuration (Environment variable required, no default password fallback)
jwt.secret=${JWT_SECRET}

# Demo Data Seeder Configuration (Explicitly disabled in production MySQL profile)
app.seed.demo-data=false
