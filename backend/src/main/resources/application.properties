spring.application.name=attendance-management

# Database Configuration (Configured for MySQL 8 local instance)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/edutrack_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:manager}
spring.datasource.driver-class-name=${DB_DRIVER:com.mysql.cj.jdbc.Driver}

# H2 Console Configuration
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Flyway Migration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.generate_statistics=true

# JWT Configuration
jwt.secret=${JWT_SECRET:9a2f8c4e1b7d3f6a8e5c2b9d4f7a1e3c8b5a2f9e4c7d1b3f6a8e5c2b9d4f7a1e}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Demo Data Seeder Configuration (Defaults to false globally, enabled only in dev profile)
app.seed.demo-data=${SEED_DEMO_DATA:false}
